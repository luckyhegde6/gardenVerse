services:
  postgres:
    image: postgres:16-alpine
    container_name: gardenverse-postgres
    environment:
      POSTGRES_DB: gardenverse
      POSTGRES_USER: gardenverse
      POSTGRES_PASSWORD: gardenverse123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gardenverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gardenverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: gardenverse-network
