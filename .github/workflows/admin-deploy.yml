name: Admin Dashboard Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/admin/**'
      - 'vercel.json'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'packages/admin/**'

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run admin:build
      - run: npm run typecheck:admin

  deploy-preview:
    name: Preview Deploy (PR)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Build check (local)
        run: npm run admin:build
      - name: Deploy to Vercel (cloud build)
        id: deploy
        run: |
          npx vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy.log
          DEPLOY_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' deploy.log | head -1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      - name: Smoke tests
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for path in / /login /about /features /ai-scanner /support; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path")
            echo "$path: $code"
            [ "$code" = "200" ] || [ "$code" = "307" ] || exit 1
          done
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `:white_check_mark: Preview deployed: ${{ steps.deploy.outputs.url }}`
            })

  deploy-production:
    name: Production Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Deploy to Vercel (cloud build)
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Post-Deploy Verification
        run: |
          URL="https://gardenverse.vercel.app"
          echo "=== POST-DEPLOY VERIFICATION ==="
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "[1/6] Homepage: $code"
          [ "$code" = "200" ] || [ "$code" = "307" ]
          for route in /about /features /ai-scanner /ai-scanner/history /support /onboarding; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$route")
            echo "[2/6] $route: $code"
            [ "$code" = "200" ]
          done
          curl -s "$URL/login" | grep -q "Email"
          echo "[3/6] Login form: OK"
          dash_code=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL/dashboard")
          echo "[4/6] Dashboard redirect: $dash_code"
          notes_code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/notes")
          echo "[5/6] Notes: $notes_code"
          crop_code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/garden/crop/test")
          echo "[6/6] Crop detail: $crop_code"
          echo "=== VERIFICATION PASSED ==="
      - name: E2E Tests
        if: success()
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/tests/screenshots.spec.ts --reporter=html || echo "E2E tests skipped (no backend deployed)"
      - name: Notify
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':warning:' }} Admin deploy ${{ job.status }}: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
