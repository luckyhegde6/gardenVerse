name: Admin Dashboard CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/admin/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json
      - run: npm ci
      - run: npm run build
