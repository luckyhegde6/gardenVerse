name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx tsc --noEmit -p packages/mobile/tsconfig.json

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test

  # Build APK via EAS preview profile (for website download)
  # The APK is downloaded to public/downloads/ and served as a static asset
  eas-build-preview:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Check EAS credentials
        id: check-creds
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN/EAS_PROJECT_ID not set — skipping EAS build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Install EAS CLI
        if: steps.check-creds.outputs.skip != 'true'
        run: npm install -g eas-cli
      - name: EAS Build (preview - APK)
        if: steps.check-creds.outputs.skip != 'true'
        run: |
          npx eas build --profile preview --platform android --non-interactive > eas-build-output.txt 2>&1
          echo "EAS_BUILD_OUTPUT<<EOF" >> $GITHUB_ENV
          cat eas-build-output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          API_URL: ${{ vars.API_URL || 'https://gardenverse.vercel.app/api/v1' }}
          WS_URL: ${{ vars.WS_URL || 'wss://ws.gardenverse.app' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - name: Extract APK download URL
        if: steps.check-creds.outputs.skip != 'true'
        id: apk-url
        run: |
          APK_URL=$(grep -oP 'https://[^\s"]+\.apk' eas-build-output.txt | head -1)
          if [ -z "$APK_URL" ]; then
            APK_URL=$(grep -oP '(https://expo\.artifacts\.vercel\.net|https://[^\s"]+build[^\s"]+)' eas-build-output.txt | head -1)
          fi
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          echo "APK download URL: $APK_URL"
      - name: Download APK to public/downloads
        if: steps.check-creds.outputs.skip != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/packages/admin/public/downloads"
          echo "Downloading APK from: $APK_URL"
          curl -L -o "$GITHUB_WORKSPACE/packages/admin/public/downloads/gardenverse-latest.apk" "$APK_URL"
          ls -la "$GITHUB_WORKSPACE/packages/admin/public/downloads/gardenverse-latest.apk"
          echo "APK_SIZE_MB=$(du -m "$GITHUB_WORKSPACE/packages/admin/public/downloads/gardenverse-latest.apk" | cut -f1)" >> $GITHUB_ENV

  # Build AAB via EAS production profile (for Google Play)
  # Only run on main branch with secrets configured to avoid non-interactive failures
  eas-build-production:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Check EAS credentials
        id: check-creds
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN/EAS_PROJECT_ID not set — skipping EAS production build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Install EAS CLI
        if: steps.check-creds.outputs.skip != 'true'
        run: npm install -g eas-cli
      - name: EAS Build (production - AAB)
        if: steps.check-creds.outputs.skip != 'true'
        run: npx eas build --profile production --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          API_URL: ${{ vars.API_URL || 'https://gardenverse.vercel.app/api/v1' }}
          WS_URL: ${{ vars.WS_URL || 'wss://ws.gardenverse.app' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
