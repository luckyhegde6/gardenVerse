apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath().replace('\\', '/')
def repoRoot = new File(projectRoot).getParentFile().getAbsolutePath().replace('\\', '/')
def separator = System.getProperty("os.name").toLowerCase().contains("win") ? ";" : ":"
def nodeModulesPath = projectRoot + "/node_modules" + separator + repoRoot + "/node_modules"

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  // Read version directly from package.json to avoid providers.exec scope issues on Windows.
  // react-native is in the mobile package's node_modules (workspace layout).
  def mobileRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath().replace('\\', '/')
  def packageJson = new File(mobileRoot, "node_modules/react-native/package.json")
  def version = packageJson.readLines().find { it.contains('"version"') }.replaceAll(/.*"version"\s*:\s*"([^"]+)".*/, '$1')

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(
      major,
      minor,
      patch
  )
}
def rnVersion = getRNVersion()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    def resolveEntry = ["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(["NODE_PATH=" + nodeModulesPath], rootDir).text.trim()
    entryFile = file(resolveEntry)
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(["NODE_PATH=" + nodeModulesPath], rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(["NODE_PATH=" + nodeModulesPath], rootDir).text.trim()).getParentFile().getAbsolutePath().replace('\\', '/') + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(["NODE_PATH=" + nodeModulesPath], rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use react-native CLI instead of @expo/cli to avoid Metro Bundler hang on Windows.
    // @expo/cli's export:embed command causes Metro 0.80.3 file crawler to hang.
    cliFile = new File(["node", "--print", "require.resolve('@react-native-community/cli/build/index.js')"].execute(["NODE_PATH=" + nodeModulesPath], rootDir).text.trim())
    bundleCommand = "bundle"
    nodeExecutableAndArgs = ["node"]
    // Hermes disabled for debug builds because the Metro Bundler hang prevents
    // generating the Hermes bytecode. Use pre-built JS bundle instead.
    hermesEnabled = false

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    extraPackagerArgs = ["--max-workers", "2"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        /* Autolinking */
        autolinkLibrariesWithApp()
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.gardenverse.app'
    defaultConfig {
        applicationId 'com.gardenverse.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            // Disable ProGuard/minification for local dev builds (speeds up build 10x)
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs false
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }

    // Limit build to arm64-v8a only (emulator supports ARM binary translation)
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Fix for Detox instrumentation crash: missing Room/paging classes
    implementation("androidx.room:room-runtime:2.6.1")
    implementation("androidx.room:room-ktx:2.6.1")
    implementation("androidx.paging:paging-runtime:3.2.1")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle");
    applyNativeModulesAppBuildGradle(project)
}



// Metro Bundler hangs on Windows when crawling root node_modules.
// Use pre-built JS bundle from `npx react-native bundle` instead of running Metro.
// Hermes is disabled for debug builds to avoid needing the Hermes bytecode step.
def bundleAssetName = "index.android.bundle"
def prebuiltBundleDir = file("src/main/assets")
def genAssetsDir = new File(project.buildDir, "generated/assets/react/debug")

task copyPrebuiltBundle {
    doLast {
        genAssetsDir.mkdirs()
        if (file("${prebuiltBundleDir}/${bundleAssetName}").exists()) {
            copy {
                from prebuiltBundleDir
                into genAssetsDir
                include bundleAssetName
            }
            println "Copied pre-built bundle from ${prebuiltBundleDir}/${bundleAssetName} to ${genAssetsDir}/${bundleAssetName}"
        } else {
            throw new GradleException("Pre-built bundle not found at ${prebuiltBundleDir}/${bundleAssetName}. Run: cd ${projectDir} && npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output src/main/assets/${bundleAssetName} --assets-dest src/main/res/ --reset-cache --max-workers 2")
        }
    }
}

afterEvaluate {
    // Disable Metro bundling for all variants — use pre-built bundle instead
    // (Metro 0.80.x file crawler hangs on Windows with large node_modules)
    ["createBundleDebugJsAndAssets", "createBundleReleaseJsAndAssets"].each { taskName ->
        def bundleTask = tasks.findByName(taskName)
        if (bundleTask != null) {
            bundleTask.enabled = false
        }
    }
    // Wire pre-built bundle into both debug and release variants
    def mergeTasks = ["mergeDebugAssets", "mergeReleaseAssets", "mergeDebugResources", "mergeReleaseResources"]
    mergeTasks.each { taskName ->
        def t = tasks.findByName(taskName)
        if (t != null) {
            t.dependsOn(copyPrebuiltBundle)
        }
    }
}
