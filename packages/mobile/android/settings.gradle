pluginManagement {
  def mobileRoot = new File(rootDir, "..").absolutePath.replace('\\', '/')
  def repoRoot = new File(rootDir, "../../..").absolutePath.replace('\\', '/')
  def nodeModulesPath = mobileRoot + "/node_modules;" + repoRoot + "/node_modules"

  def version = providers.exec {
    environment("NODE_PATH", nodeModulesPath)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()
  def (_, reactNativeMinor, reactNativePatch) = version.split("-")[0].tokenize('.').collect { it.toInteger() }

  includeBuild(new File(repoRoot, "node_modules/@react-native/gradle-plugin").toString())
  if(reactNativeMinor == 74 && reactNativePatch <= 3){
    includeBuild("react-settings-plugin")
  }
}

plugins { id("com.facebook.react.settings") }

// Additional includeBuild with dependencySubstitution so that
// expo-updates-gradle-plugin can resolve react-native-gradle-plugin
// as a compileOnly dependency from the included build.
def _repoRoot = new File(rootDir, "../../..").absolutePath.replace('\\', '/')
includeBuild(new File(_repoRoot, "node_modules/@react-native/gradle-plugin").toString()) {
  dependencySubstitution {
    substitute module("com.facebook.react:react-native-gradle-plugin") using project(":react-native-gradle-plugin")
  }
}

def getRNMinorVersion() {
  def mobileRoot = new File(rootDir, "..").absolutePath.replace('\\', '/')
  def repoRoot = new File(rootDir, "../../..").absolutePath.replace('\\', '/')
  def nodeModulesPath = mobileRoot + "/node_modules;" + repoRoot + "/node_modules"
  def version = providers.exec {
    environment("NODE_PATH", nodeModulesPath)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return minor
}

if (getRNMinorVersion() >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('Using expo-modules-autolinking as core autolinking source')
      def command = [
        'node',
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      ex.autolinkLibrariesFromCommand()
    }
  }
}

rootProject.name = 'GardenVerse'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      def mobileRoot = new File(rootDir, "..").absolutePath.replace('\\', '/')
      from(files(new File(mobileRoot, "node_modules/react-native/gradle/libs.versions.toml").toString()))
    }
  }
}

def mobileRoot = new File(rootDir, "..").absolutePath.replace('\\', '/')
def repoRoot = new File(rootDir, "../../..").absolutePath.replace('\\', '/')
apply from: new File(repoRoot, "node_modules/expo/scripts/autolinking.gradle").toString();
useExpoModules()

if (getRNMinorVersion() < 75) {
  apply from: new File(repoRoot, "node_modules/@react-native-community/cli-platform-android/native_modules.gradle").toString();
  applyNativeModulesSettingsGradle(settings)
}

include ':app'
