name: Mobile Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mobile/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile from eas.json'
        type: choice
        options: [development, preview, production]
        default: production
      platform:
        description: 'Platform to build'
        type: choice
        options: [android]
        default: android

defaults:
  image: sdk-51

jobs:
  build-development:
    name: Development Build
    type: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'development' }}
    params:
      platform: ${{ inputs.platform || 'android' }}
      profile: development

  build-production:
    name: Production Build
    type: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    params:
      platform: android
      profile: production
